name: winterflowspace-api

namespace: winterflowspace
env:
  APP_VERSION: 0d60f9ee98fd34760810e0b20632ca33b55adfff

deployment:
  - name: winterflowspace-api
    image: invisibug/winterflowspace-api
    ports:
      - port: 3000

# ingress:
#   - name: api.winterflowspace.com
#     selector: winterflowspace-api
#     path: /
#     port: 3000
#     host: api.winterflowspace.com

# service:
#   loadBalancer:
#     - name: winterflowspace-api
#       selector: winterflowspace-api
#       port: 80
#       containerPort: 3000

service:
  name: winterflowspace-api
  selector: winterflowspace-api
  port: 80
  targetPort: 3000

httpRoute:
  name: winterflowspace-api
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: api.winterflowspace.com
  path: /
  serviceName: winterflowspace-api
  servicePort: 80
